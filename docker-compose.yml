services:
  postgres:
    image: postgres:16-alpine
    container_name: secureai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: secureai
      POSTGRES_PASSWORD: secureai
      POSTGRES_DB: secureai
    ports:
      - "5432:5432"
    volumes:
      - secureai_pgdata:/var/lib/postgresql/data

volumes:
  secureai_pgdata:
